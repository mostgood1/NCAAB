<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results Archive</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    header { display: flex; align-items: baseline; gap: 12px; }
    select, button { padding: 6px 10px; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; }
    thead th { position: sticky; top: 0; z-index: 1; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background: #f5f5f5; text-align: left; }
    tbody tr:nth-child(odd) { background: #fafafa; }
    .meta { margin-top: 8px; color: #666; }
    .grid { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
    .center { text-align: center; }
    .num { text-align: right; }
    .chip { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 12px; line-height: 1; }
    .chip.over { background: #e6f7ff; color: #036; border: 1px solid #b3e5ff; }
    .chip.under { background: #fff3e6; color: #633; border: 1px solid #ffd9b3; }
    .chip.home { background: #e8f5e9; color: #064; border: 1px solid #c8e6c9; }
    .chip.away { background: #f3e5f5; color: #503; border: 1px solid #e1bee7; }
    .teamCell { display: inline-flex; align-items: center; gap: 8px; }
    .teamLogo { width: 18px; height: 18px; border-radius: 2px; object-fit: contain; }
    tbody tr { border-left: 4px solid #ddd; border-right: 4px solid #ddd; }
  </style>
</head>
<body>
  <header>
    <h1>Results Archive</h1>
    <a href="/">Home</a>
  </header>

  <div class="grid">
    <div>
      <label for="dateSel">Date:</label>
      <select id="dateSel"></select>
      <button id="refreshBtn">Load</button>
    </div>
    <div class="meta" id="meta"></div>
  </div>

  <div id="qmetrics" class="grid" style="margin-top:12px; grid-template-columns: repeat(4, minmax(160px, 1fr));">
    <div><div class="meta">CRPS Total</div><div id="crpsTotal">—</div></div>
    <div><div class="meta">CRPS Margin</div><div id="crpsMargin">—</div></div>
    <div><div class="meta">80% Coverage Total</div><div id="covTotal">—</div></div>
    <div><div class="meta">80% Coverage Margin</div><div id="covMargin">—</div></div>
  </div>

  <div class="meta" style="margin-top:8px;">
    <a id="quantileLink" href="/quantile-metrics" target="_blank">Open Quantile Metrics</a>
    &nbsp;|&nbsp;
    <a href="/drift-weekly" target="_blank">Weekly Drift</a>
    &nbsp;|&nbsp;
    <a id="downloadCsv" href="#" target="_blank">Download CSV</a>
  </div>

  <table id="table">
    <thead>
      <tr>
        <th>Game ID</th>
        <th>Date</th>
        <th>Home</th>
        <th>Away</th>
        <th>Home Score</th>
        <th>Away Score</th>
        <th>ATS</th>
        <th>OU Full</th>
        <th>Home Cover</th>
        <th>Over</th>
        <th>Pred OU</th>
        <th>OU Correct</th>
        <th>Pred ATS</th>
        <th>ATS Correct</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function fetchJSON(url) {
      const r = await fetch(url);
      return r.json();
    }
    function renderRows(rows) {
      const tbody = document.querySelector('#table tbody');
      tbody.innerHTML = '';
      const cols = ['game_id','date','home_team','away_team','home_score','away_score','ats_result','ou_result_full','ats_home_cover','ou_over','pred_ou','ou_correct','pred_ats','ats_correct'];
      rows.forEach(r => {
        const tr = document.createElement('tr');
        // Apply subtle color accents using team branding colors if present
        if (r.home_color) tr.style.borderLeftColor = r.home_color;
        if (r.away_color) tr.style.borderRightColor = r.away_color;
        cols.forEach(c => {
          const td = document.createElement('td');
          let val = r[c];
          if (c.endsWith('_correct') && (val === true || val === false || val === 'True' || val === 'False')) {
            const ok = (val === true || val === 'True');
            td.textContent = ok ? '✓' : '✗';
            td.classList.add('center');
            td.style.color = ok ? '#0a7' : '#c33';
          } else if (c === 'ats_result' && typeof val === 'string' && val) {
            const span = document.createElement('span');
            const isHome = val.toLowerCase().includes('home');
            span.className = 'chip ' + (isHome ? 'home' : 'away');
            span.textContent = val;
            td.appendChild(span);
          } else if (c === 'ou_result_full' && typeof val === 'string' && val) {
            const span = document.createElement('span');
            const isOver = val.toLowerCase().startsWith('over');
            span.className = 'chip ' + (isOver ? 'over' : 'under');
            span.textContent = val;
            td.appendChild(span);
          } else if (c === 'ats_home_cover' && (val === true || val === false || val === 'True' || val === 'False')) {
            const isHome = (val === true || val === 'True');
            const span = document.createElement('span');
            span.className = 'chip ' + (isHome ? 'home' : 'away');
            span.textContent = isHome ? 'Home Cover' : 'Away Cover';
            td.appendChild(span);
          } else if (c === 'ou_over' && (val === true || val === false || val === 'True' || val === 'False')) {
            const isOver = (val === true || val === 'True');
            const span = document.createElement('span');
            span.className = 'chip ' + (isOver ? 'over' : 'under');
            span.textContent = isOver ? 'Over' : 'Under';
            td.appendChild(span);
          } else if (c === 'pred_ou' && typeof val === 'string' && val) {
            const span = document.createElement('span');
            span.className = 'chip ' + (val.toLowerCase().startsWith('over') ? 'over' : 'under');
            span.textContent = val;
            td.appendChild(span);
          } else if (c === 'pred_ats' && typeof val === 'string' && val) {
            const span = document.createElement('span');
            const isHome = val.toLowerCase().includes('home');
            span.className = 'chip ' + (isHome ? 'home' : 'away');
            span.textContent = val;
            td.appendChild(span);
          } else if (c === 'home_team' || c === 'away_team') {
            const cell = document.createElement('div');
            cell.className = 'teamCell';
            const logo = (c === 'home_team') ? r.home_logo : r.away_logo;
            const textColor = (c === 'home_team') ? r.home_text : r.away_text;
            if (logo) {
              const img = document.createElement('img');
              img.className = 'teamLogo';
              img.src = logo;
              img.alt = val || '';
              cell.appendChild(img);
            }
            const nameSpan = document.createElement('span');
            nameSpan.textContent = (val ?? '');
            if (textColor) nameSpan.style.color = textColor;
            cell.appendChild(nameSpan);
            td.appendChild(cell);
          } else {
            td.textContent = (val ?? '');
          }
          if (c === 'home_score' || c === 'away_score') td.classList.add('num');
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }
    async function loadDates() {
      const data = await fetchJSON('/api/results_dates');
      const sel = document.getElementById('dateSel');
      sel.innerHTML = '';
      (data.dates || []).forEach(d => {
        const opt = document.createElement('option');
        opt.value = d; opt.textContent = d;
        sel.appendChild(opt);
      });
    }
    async function loadResults() {
      const sel = document.getElementById('dateSel');
      const date = sel.value;
      const data = await fetchJSON('/api/results_by_date?date=' + encodeURIComponent(date));
      const s = data.summary || {};
      let metaText = `Count: ${data.count}`;
      if (s.ats_total) {
        const accA = (typeof s.ats_accuracy === 'number') ? `${s.ats_accuracy.toFixed(1)}%` : '—';
        metaText += ` | ATS ${s.ats_correct ?? '—'}/${s.ats_total ?? '—'} (${accA})`;
      }
      if (s.totals_total) {
        const accT = (typeof s.totals_accuracy === 'number') ? `${s.totals_accuracy.toFixed(1)}%` : '—';
        metaText += ` | OU ${s.totals_correct ?? '—'}/${s.totals_total ?? '—'} (${accT})`;
      }
      document.getElementById('meta').textContent = metaText;
      renderRows(data.rows || []);
      // Load quantile metrics for the date
      const qm = await fetchJSON('/api/quantile-metrics?date=' + encodeURIComponent(date));
      if (qm.status === 'ok' && Array.isArray(qm.data) && qm.data.length > 0) {
        const r = qm.data[0];
        document.getElementById('crpsTotal').textContent = r.crps_total ?? '—';
        document.getElementById('crpsMargin').textContent = r.crps_margin ?? '—';
        document.getElementById('covTotal').textContent = r.covered_80_total ?? '—';
        document.getElementById('covMargin').textContent = r.covered_80_margin ?? '—';
      } else {
        document.getElementById('crpsTotal').textContent = '—';
        document.getElementById('crpsMargin').textContent = '—';
        document.getElementById('covTotal').textContent = '—';
        document.getElementById('covMargin').textContent = '—';
      }
      // Update links
      const link = document.getElementById('quantileLink');
      link.href = '/quantile-metrics?date=' + encodeURIComponent(date);
      const dl = document.getElementById('downloadCsv');
      dl.href = '/api/results_by_date?date=' + encodeURIComponent(date) + '&download=csv';
    }
    document.getElementById('refreshBtn').addEventListener('click', loadResults);
    (async function init(){ await loadDates(); await loadResults(); })();
  </script>
</body>
</html>
