services:
  - type: web
    name: ncaab-frontend
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 120 --max-requests 200 --max-requests-jitter 50 --bind 0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: NCAAB_BOOTSTRAP_ON_START
        value: "0"
      - key: NCAAB_THEODDS_API_KEY
        sync: false
        fromSecret: theoddsapi-key
      - key: TZ
        value: UTC
      - key: NCAAB_LIGHT_MODE
        value: "1"
      - key: NCAAB_P_OVER_THRESHOLD_HIGH
        value: "0.50"
      - key: NCAAB_P_OVER_THRESHOLD_LOW
        value: "0.42"
      - key: STABLE_DISPLAY
        value: "1"
      - key: SNAPSHOT_ONLY
        value: "1"
      - key: NCAAB_TOTALS_MODE
        value: model
    healthCheckPath: /healthz
    
    # Optional persistent disk if you later want to write outputs on Render
    # disks:
    #   - name: data
    #     mountPath: /opt/render/project/data
    #     sizeGB: 1
