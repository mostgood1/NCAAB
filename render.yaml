services:
  - type: web
    name: ncaab-frontend
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python app.py
    autoDeploy: true
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: NCAAB_BOOTSTRAP_ON_START
        value: "0"
      - key: NCAAB_THEODDS_API_KEY
        sync: false
        fromSecret: theoddsapi-key
      - key: TZ
        value: UTC
      - key: NCAAB_LIGHT_MODE
        value: "1"
    healthCheckPath: /healthz
    
    # Optional persistent disk if you later want to write outputs on Render
    # disks:
    #   - name: data
    #     mountPath: /opt/render/project/data
    #     sizeGB: 1
