services:
  - type: web
    name: ncaab-frontend
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --workers 1 --threads 2 --timeout 120 --max-requests 200 --max-requests-jitter 50 --bind 0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: NCAAB_BOOTSTRAP_ON_START
        value: "0"
      - key: RECS_FAST_GROUP
        value: "0"
      - key: NCAAB_THEODDS_API_KEY
        sync: false
        fromSecret: NCAAB_THEODDS_API_KEY
      - key: TZ
        value: UTC
      - key: NCAAB_LIGHT_MODE
        value: "1"
      - key: NCAAB_P_OVER_THRESHOLD_HIGH
        value: "0.60"
      - key: NCAAB_P_OVER_THRESHOLD_LOW
        value: "0.40"
      - key: NCAAB_MIN_OU_RECS
        value: "5"
      - key: STABLE_DISPLAY
        value: "0"
      - key: SNAPSHOT_ONLY
        value: "0"
      - key: NCAAB_TOTALS_MODE
        value: model
      # 2-min point-allocation late-game shaping (proxy-based by spread if present, else model margin)
      - key: NCAAB_LATE_ALLOC_SHAPE
        value: "1"
      - key: NCAAB_LATE_ALLOC_CLOSE_MAX
        value: "6"
      - key: NCAAB_LATE_ALLOC_BLOWOUT_MIN
        value: "11"
      - key: NCAAB_LATE_ALLOC_LAST_MULT_CLOSE
        value: "1.20"
      - key: NCAAB_LATE_ALLOC_LAST_MULT_BLOWOUT
        value: "0.65"
    healthCheckPath: /healthz
    
    # Optional persistent disk if you later want to write outputs on Render
    # disks:
    #   - name: data
    #     mountPath: /opt/render/project/data
    #     sizeGB: 1
